<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Review of Bidding Boards</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111418;
    color: #e8e8e8;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; color: #f0f0f0; text-align: center; }
  .layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
  }
  .main-col {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Sidebar */
  .sidebar {
    width: 64px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 10px 8px;
    background: #1a1d22;
    border-radius: 10px;
    position: sticky;
    top: 24px;
  }
  .sidebar-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }
  .sidebar-swatch {
    width: 40px;
    height: 26px;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    border: 1px solid #333;
  }
  .sidebar-item.current .sidebar-swatch { border-color: #7aa2ff; border-width: 2px; }
  .sidebar-seg { flex: 1; }
  .seg-filled { background: #2ecc71; }
  .seg-empty { background: #b23b3b; }
  .sidebar-num { font-size: 11px; color: #999; }
  .sidebar-item.current .sidebar-num { color: #7aa2ff; font-weight: 600; }
  .sidebar-legend {
    font-size: 9px;
    color: #666;
    text-align: center;
    line-height: 1.5;
    padding-bottom: 4px;
    border-bottom: 1px solid #2a2d33;
    margin-bottom: 2px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 12px;
  }
  .refresh-btn {
    background: #1a1d22;
    border: 1px solid #333;
    color: #ccc;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .refresh-btn:hover { border-color: #7aa2ff; color: #fff; }
  .status { font-size: 12px; color: #7aa2ff; min-height: 16px; }
  .empty-state {
    color: #666;
    font-size: 13px;
    text-align: center;
    padding: 40px 20px;
    background: #1a1d22;
    border-radius: 12px;
    width: 100%;
  }

  .slideshow {
    width: 100%;
    background: #1a1d22;
    border-radius: 12px;
    overflow: hidden;
    display: none;
  }
  .slideshow.active { display: block; }
  .slide-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide-viewport img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.5); border: none; color: #fff;
    font-size: 20px; width: 40px; height: 40px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: rgba(0,0,0,0.75); }
  .nav-btn.prev { left: 12px; }
  .nav-btn.next { right: 12px; }
  .counter { text-align: center; padding: 10px 0 4px; font-size: 13px; color: #999; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 4px 0 14px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; cursor: pointer; border: none; padding: 0; }
  .dot.active { background: #7aa2ff; }
  .comments { width: 100%; margin-top: 20px; display: none; }
  .comments.active { display: block; }
  .comment-field { margin-bottom: 14px; }
  .comment-field label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; font-weight: 600; }
  .comment-field textarea {
    width: 100%; min-height: 70px; resize: vertical;
    background: #1a1d22; border: 1px solid #333; border-radius: 8px;
    padding: 10px 12px; color: #e8e8e8; font-family: inherit; font-size: 14px;
  }
  .comment-field textarea:focus { outline: none; border-color: #7aa2ff; }
  .save-note { font-size: 12px; color: #666; }
  .thumbs { display: flex; gap: 6px; padding: 10px; overflow-x: auto; background: #14161a; }
  .thumbs img {
    height: 48px; width: 48px; object-fit: cover; border-radius: 6px;
    cursor: pointer; opacity: 0.5; flex-shrink: 0; border: 2px solid transparent;
  }
  .thumbs img.active { opacity: 1; border-color: #7aa2ff; }
</style>
</head>
<body>

<h1>Review of Bidding Boards</h1>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-legend">TW&nbsp;/&nbsp;TXH&nbsp;/&nbsp;ZYK</div>
  </div>

  <div class="main-col">
    <div class="toolbar">
      <div class="status" id="status">Loading photos from Drive...</div>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>

    <div class="empty-state" id="emptyState" style="display:none">
      No images found in the Drive folder. Add photos there, then click Refresh.
    </div>

    <div class="slideshow" id="slideshow">
      <div class="slide-viewport">
        <button class="nav-btn prev" id="prevBtn">&#10094;</button>
        <img id="slideImg" src="" alt="">
        <button class="nav-btn next" id="nextBtn">&#10095;</button>
      </div>
      <div class="counter" id="counter"></div>
      <div class="dots" id="dots"></div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="comments" id="comments">
      <div class="comment-field">
        <label for="commentTW">TW</label>
        <textarea id="commentTW" placeholder="TW's comments on this board"></textarea>
      </div>
      <div class="comment-field">
        <label for="commentTXH">TXH</label>
        <textarea id="commentTXH" placeholder="TXH's comments on this board"></textarea>
      </div>
      <div class="comment-field">
        <label for="commentZYK">ZYK</label>
        <textarea id="commentZYK" placeholder="ZYK's comments on this board"></textarea>
      </div>
      <div class="save-note" id="saveNote"></div>
    </div>
  </div>
</div>

<!-- Firebase SDKs (compat build, no bundler required) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
// ---- Config ----
const firebaseConfig = {
  apiKey: "AIzaSyCem5EbVUeKJUihyEppP1iPEh6aYNNvKhc",
  authDomain: "coaching-u26.firebaseapp.com",
  projectId: "coaching-u26",
  storageBucket: "coaching-u26.firebasestorage.app",
  messagingSenderId: "928921692411",
  appId: "1:928921692411:web:b95f23533ee39461db685e"
};

const DRIVE_API_KEY = "AIzaSyDw-2QQ45WRplv8HMCqNF9dvF-kGf_dB7Y";
const DRIVE_FOLDER_ID = "1Jz-KEPQmKMsSQrRWnbpTyUC69F2SQ2lk";

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Firestore doc holds only the comments, keyed by Drive file ID
// (the image list itself always comes live from Drive, not from Firestore).
const DOC_REF = db.collection('slideshows').doc('main');
const FIELDS = ['TW', 'TXH', 'ZYK'];

let images = []; // [{id, name, url}]
let commentsMap = {}; // { [driveFileId]: {TW, TXH, ZYK} }
let current = 0;
let saveTimer = null;

const statusEl = document.getElementById('status');
const refreshBtn = document.getElementById('refreshBtn');
const emptyState = document.getElementById('emptyState');
const slideshow = document.getElementById('slideshow');
const slideImg = document.getElementById('slideImg');
const counter = document.getElementById('counter');
const dots = document.getElementById('dots');
const thumbs = document.getElementById('thumbs');
const comments = document.getElementById('comments');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const saveNote = document.getElementById('saveNote');
const sidebar = document.getElementById('sidebar');
const fieldEls = { TW: document.getElementById('commentTW'), TXH: document.getElementById('commentTXH'), ZYK: document.getElementById('commentZYK') };

function blankComments() { return { TW: '', TXH: '', ZYK: '' }; }
function driveImageUrl(id) { return `https://drive.google.com/thumbnail?id=${id}&sz=w1600`; }

// ---- Load comments from Firestore ----
async function loadComments() {
  const snap = await DOC_REF.get();
  commentsMap = snap.exists ? (snap.data().comments || {}) : {};
}

// ---- List images from the Drive folder ----
async function loadImages() {
  statusEl.textContent = 'Loading photos from Drive...';
  const q = encodeURIComponent(`'${DRIVE_FOLDER_ID}' in parents and mimeType contains 'image/' and trashed = false`);
  const url = `https://www.googleapis.com/drive/v3/files?q=${q}&key=${DRIVE_API_KEY}&fields=files(id,name)&orderBy=name&pageSize=1000`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) {
      statusEl.textContent = `Drive error: ${data.error.message}`;
      console.error('Drive API error:', data.error);
      return;
    }
    images = (data.files || []).map(f => ({ id: f.id, name: f.name, url: driveImageUrl(f.id) }));
    statusEl.textContent = images.length ? '' : '';
  } catch (err) {
    statusEl.textContent = 'Failed to load from Drive — check console.';
    console.error(err);
  }
}

async function refreshAll() {
  await Promise.all([loadImages(), loadComments()]);
  current = Math.min(current, Math.max(images.length - 1, 0));
  render();
}

refreshBtn.addEventListener('click', refreshAll);
refreshAll();

// ---- Per-slide comment fields: debounce-save on input ----
FIELDS.forEach(field => {
  fieldEls[field].addEventListener('input', () => {
    if (!images.length) return;
    const id = images[current].id;
    commentsMap[id] = commentsMap[id] || blankComments();
    commentsMap[id][field] = fieldEls[field].value;
    renderSidebar();

    saveNote.textContent = 'Saving...';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      await DOC_REF.set({ comments: commentsMap }, { merge: true });
      saveNote.textContent = 'Saved';
      setTimeout(() => saveNote.textContent = '', 1200);
    }, 600);
  });
});

// ---- Render ----
function render() {
  if (!images.length) {
    slideshow.classList.remove('active');
    comments.classList.remove('active');
    emptyState.style.display = 'block';
    renderSidebar();
    return;
  }
  emptyState.style.display = 'none';
  slideshow.classList.add('active');
  comments.classList.add('active');

  current = Math.max(0, Math.min(current, images.length - 1));
  const img = images[current];
  slideImg.src = img.url;
  counter.textContent = `${current + 1} / ${images.length}`;

  const c = commentsMap[img.id] || blankComments();
  FIELDS.forEach(field => { fieldEls[field].value = c[field] || ''; });

  dots.innerHTML = '';
  images.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (i === current ? ' active' : '');
    d.addEventListener('click', () => { current = i; render(); });
    dots.appendChild(d);
  });

  thumbs.innerHTML = '';
  images.forEach((im, i) => {
    const t = document.createElement('img');
    t.src = im.url;
    t.className = i === current ? 'active' : '';
    t.addEventListener('click', () => { current = i; render(); });
    thumbs.appendChild(t);
  });

  renderSidebar();
}

function renderSidebar() {
  sidebar.querySelectorAll('.sidebar-item').forEach(el => el.remove());
  images.forEach((img, i) => {
    const c = commentsMap[img.id] || blankComments();
    const item = document.createElement('button');
    item.className = 'sidebar-item' + (i === current ? ' current' : '');
    item.title = `Slide ${i + 1}: ${img.name}`;

    const swatch = document.createElement('div');
    swatch.className = 'sidebar-swatch';
    FIELDS.forEach(field => {
      const seg = document.createElement('div');
      const filled = (c[field] || '').trim().length > 0;
      seg.className = 'sidebar-seg ' + (filled ? 'seg-filled' : 'seg-empty');
      swatch.appendChild(seg);
    });

    const num = document.createElement('div');
    num.className = 'sidebar-num';
    num.textContent = i + 1;

    item.appendChild(swatch);
    item.appendChild(num);
    item.addEventListener('click', () => { current = i; render(); });
    sidebar.appendChild(item);
  });
}

prevBtn.addEventListener('click', () => { current = (current - 1 + images.length) % images.length; render(); });
nextBtn.addEventListener('click', () => { current = (current + 1) % images.length; render(); });
document.addEventListener('keydown', e => {
  if (!images.length) return;
  if (e.key === 'ArrowLeft') { current = (current - 1 + images.length) % images.length; render(); }
  if (e.key === 'ArrowRight') { current = (current + 1) % images.length; render(); }
});
</script>

</body>
</html>
